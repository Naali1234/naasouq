<style>

.fav{position:absolute;top:6px;inset-inline-end:6px;border:0;background:rgba(255,255,255,.92);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px;line-height:32px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}

</style>
<style>

<body>
<header>
  <div class="top">
    <div class="logo" onclick="goHome(event)"><img src="logo-full.png" alt="Naa Souq"></div>
    <form class="search" onsubmit="event.preventDefault();doSearch()">
      <input id="q" type="text" placeholder="Search ads in your country…" autocomplete="off">
      <button type="submit" id="qbtn">Search</button>
    </form>
    <div class="hbtns"><button class="cbtn" id="cbtn" onclick="openCountry()"></button><button class="cbtn lbtn" id="lbtn" onclick="toggleLang()">عربي</button><button class="cbtn lbtn" id="abtn" onclick="acctBtn()">👤</button></div>
  </div>
</header>
<main id="view"></main>
<nav><div class="in" id="nav"></div></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ---------- Business rules ---------- */
const FREE_LAUNCH=true; // free posting for the time being — set to false to start the paid plans
const FREE_ADS=5, PACK_POSTS=20, PACK_PRICE=5, PACK_DAYS=90, AD_DAYS=5, USD_QAR=3.64, MAX_PHOTOS=3;
const DAY=864e5;

const CATS=[["Mobile Phones","📱"],["Computers & Laptops","💻"],["Electronics","📺"],["Vehicles","🚗"],["Motorcycles","🏍️"],["Auto Parts & Accessories","🔧"],["Property","🏠"],["Furniture","🛋️"],["Home & Garden","🪴"],["Home Appliances","🔌"],["Clothes, Shoes & Accessories","👗"],["Jewellery & Watches","💍"],["Health & Beauty","💄"],["Kids & Baby","🧸"],["Sports","⚽"],["Gaming","🎮"],["Books & Education","📚"],["Pets & Animals","🐾"],["Home Made Food","🍲"],["Food Items","🛒"],["Services","🛠️"],["Building & Construction","🏗️"],["Industrial & Business Equipment","🏭"],["Events & Party","🎉"],["Travel & Tours","✈️"],["Agriculture","🌾"],["Others","📦"]];

function left(t){const d=t-Date.now();if(d<=0)return T("Expired");const days=Math.floor(d/DAY);if(days>=1)return T(days===1?"{0} day left":"{0} days left",days);const h=Math.ceil(d/36e5);return T(h===1?"{0} hour left":"{0} hours left",h)}

function detectCountry(){
  const ok=c=>c&&COUNTRIES.some(x=>x.c===c);
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(ok(TZ_MAP[tz]))return TZ_MAP[tz]}catch(e){}
  try{for(const l of (navigator.languages||[navigator.language])){const m=String(l).match(/[-_]([A-Za-z]{2})$/);if(m&&ok(m[1].toUpperCase()))return m[1].toUpperCase()}}catch(e){}
  return "QA";
}

/* ---------- Quota logic ---------- */
function quota(){
  const now=Date.now();
  const free=Math.max(0,FREE_ADS-(acc.freeUsed||0));
  const packActive=(acc.credits||0)>0&&(acc.packExpires||0)>now;
  return {free,credits:packActive?acc.credits:0,packActive,packCountry:acc.packCountry,packExpires:acc.packExpires};
}
function slotFor(c){if(FREE_LAUNCH)return "launch";const k=quota();if(k.free>0)return "free";if(k.packActive&&k.packCountry===c)return "pack";return null}
async function consume(slot){
  if(slot==="launch")return;
  const n={...acc};
  if(slot==="free")n.freeUsed=(n.freeUsed||0)+1;else n.credits=(n.credits||0)-1;
  n.updatedAt=Date.now();
  await db.doc("accounts/"+uid).set(n);
  acc=n;
}

  const cset=CATS.map(chip).join("");
  const chips=`<div class="chipfix">${chip(["All","✨"])}</div><div class="marq"><div class="mtrack" style="animation-duration:${CATS.length*4.5}s;animation-delay:-${((Date.now()/1000)%(CATS.length*4.5)).toFixed(2)}s"><div class="mset">${cset}</div><div class="mset" aria-hidden="true">${cset}</div></div></div>`;

  else if(!list.length)body=`<div class="empty"><div class="e">${showSaved?"❤️":flag(country)}</div>${showSaved?T("No saved ads yet — tap the heart on any ad to save it."):q||cat!=="All"||fon?T("No ads match your search."):T("No ads in {0} yet.",esc(cName(country)))}<br><br><button class="btn" onclick="go('post')">${T("Be the first to post")}</button></div>`;

function bindPost(){

function drawThumbs(){const el=$("#pthumbs");if(!el)return;if(!draftPhotos.length){const c=$("#pcat")?$("#pcat").value:"";const p=catPic(c);el.innerHTML=p?`<div style="background-image:url('${p}')"><span style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;text-align:center;border-radius:0 0 10px 10px">${T("Default")}</span></div>`:"";return}el.innerHTML=draftPhotos.map((p,i)=>`<div style="background-image:url('${p}')"><button type="button" onclick="draftPhotos.splice(${i},1);drawThumbs()">✕</button></div>`).join("")}
function compress(file,m=560){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,m/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.6))};img.onerror=()=>rej(new Error("format"));img.src=URL.createObjectURL(file)})}
async function submitAd(){

   <div class="gal" id="gal" style="${ph[0]?`background-image:url('${ph[0]}')`:""}">${ph[0]?"":catIcon(a.category)}</div>
   ${ph.length>1?`<div class="gthumbs">${ph.map((p,i)=>`<div class="${i?"":"on"}" style="background-image:url('${p}')" onclick="showPh(this,${i})"></div>`).join("")}</div>`:""}
   <div class="price" style="font-size:22px;margin-top:10px">${fmtPrice(a.price,a.currency)}</div>
   <div class="kv"><span>${T("Location")}</span><span>${flag(a.country)} ${esc(a.city)}, ${esc(cName(a.country))}</span><span>${T("Category")}</span><span>${catIcon(a.category)} ${esc(T(a.category))}</span><span>${T("Posted")}</span><span>${fmtDate(a.createdAt)}</span><span>${T("Status")}</span><span>${a.sold?`<b style="color:var(--ok)">${T("SOLD")}</b> · `:""}${esc(left(a.expiresAt))}</span><span>${T("Views")}</span><span>${a.views||0}</span><span>${T("Seller")}</span><span id="seller">…</span></div>
   <div class="desc">${esc(a.description)}</div>
   <div class="alert" style="font-size:12.5px">🛡️ ${T("Safety tip: meet in a public place and never pay before seeing the item.")}</div>
   <div class="acts">
     ${digits?`<a class="btn okb" style="text-decoration:none" href="https://wa.me/${digits}?text=${encodeURIComponent(T("Hi, I saw your ad on Naa Souq: ")+a.title)}" target="_blank" rel="noopener">${ic("whatsapp")} ${T("WhatsApp")}</a>`:""}
     <span class="btn sec" style="cursor:text">${ic("phone")} ${esc(a.phone)}</span>
     ${(mine||isOwner)&&ownN<MAX_PHOTOS?`<label class="btn sec" style="display:inline-block;margin:0;font-size:14px">${ic("camera")} ${T("Add photos")}<input type="file" accept="image/*" multiple hidden onchange="addPhotos('${esc(a.id)}',this)"></label>`:""}
     <a class="btn sec" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(a.title+" — "+(a.price===""||a.price==null?T("Price on request"):a.currency+" "+a.price)+"\n"+SITE_URL+"#ad-"+a.id)}" target="_blank" rel="noopener">📤 ${T("Share")}</a>
     <button class="btn sec" onclick="copyLink('${esc(a.id)}')">🔗 ${T("Copy link")}</button>
     ${mine?`<button class="btn sec" onclick="startEdit('${esc(a.id)}')">✏️ ${T("Edit")}</button><button class="btn sec" onclick="toggleSold('${esc(a.id)}')">${a.sold?T("Mark as available"):"✅ "+T("Mark as sold")}</button>`:""}
     ${mine||isOwner?`<button class="btn sec" onclick="delAd('${esc(a.id)}')">${mine?T("Delete my ad"):T("Remove ad")}</button>`:""}
     ${isOwner&&a.status!=="approved"?`<button class="btn okb" onclick="approveAd('${esc(a.id)}')">✅ Approve</button><button class="btn sec" onclick="rejectAd('${esc(a.id)}')">Reject</button>`:""}
     ${!mine&&uid?`<button class="btn sec" style="color:#c42a05" onclick="openReport('${esc(a.id)}')">🚩 ${T("Report ad")}</button>`:""}
   </div>`);
  window._gal=ph;
  try{if(db&&canWrite&&uid&&a.ownerId!==uid&&a.ownerId!=="demo"){const k="nx_v_"+id;let seen=false;try{seen=sessionStorage.getItem(k)}catch(e){}if(!seen){try{sessionStorage.setItem(k,"1")}catch(e){}a.views=(a.views||0)+1;db.doc("ads/"+id).update({views:a.views}).catch(()=>{})}}}catch(e){}
  let name=T("Naa Souq seller");
  if(a.ownerId==="demo")name=T("Sample listing");
  else if(user&&a.ownerId){try{const ps=await user.profiles([a.ownerId]);name=(ps&&ps[a.ownerId]&&ps[a.ownerId].name)||T("Naa Souq seller")}catch(e){}}
  const s=$("#seller");if(s)s.textContent=name;
}
async function addPhotos(id,input){
  const a=ads.find(x=>x.id===id)||myAds.find(x=>x.id===id);if(!a)return;
  const photos=[...(a.photos||[])];
  let bad=0;for(const f of [...input.files]){if(photos.length>=MAX_PHOTOS)break;try{photos.push(await compress(f))}catch(e){bad++}}
  if(photos.length===(a.photos||[]).length){toast(bad?T("This photo type can't be read — please choose a JPG or PNG photo"):"No photo selected");return}
  input.value="";
  try{await db.doc("ads/"+id).update({photos});a.photos=photos;toast("✅ Photos added");openAd(id)}catch(e){toast("Couldn't save photos — try a smaller picture")}
}
async function uploadCat(c,input){
  const f=input.files[0];input.value="";if(!f)return;
  try{const photo=await compress(f,480);await db.doc("catphotos/"+catSlug(c)).set({cat:c,photo,updatedAt:Date.now()});toast("✅ Picture saved for "+c)}catch(e){toast("Couldn't save picture")}
}
async function copyLink(id){try{await navigator.clipboard.writeText(SITE_URL+"#ad-"+id);toast(T("Link copied"))}catch(e){toast(SITE_URL+"#ad-"+id)}}
const REASONS=["Scam or fraud","Banned or illegal item","Wrong category","Duplicate or spam","Offensive content","Other"];
function openReport(id){
  const a=[...ads,...myAds,...extAds].find(x=>x.id===id);
  openModal(`<div class="hd"><h3>🚩 ${T("Report ad")}</h3><button class="x" onclick="closeModal()">✕</button></div><p class="muted" style="margin:0 0 6px">${esc(a?a.title:"")}</p>
  <label>${T("Reason")}</label><select id="rreason">${REASONS.map(r=>`<option value="${r}">${T(r)}</option>`).join("")}</select>
  <label>${T("Details (optional)")}</label><textarea id="rnote" maxlength="500"></textarea><br><br>
  <div class="acts"><button class="btn" onclick="sendReport('${esc(id)}')">${T("Send report")}</button><button class="btn sec" onclick="closeModal()">${T("Cancel")}</button></div>`);
}
async function sendReport(id){
  const a=[...ads,...myAds,...extAds].find(x=>x.id===id);
  try{const ref=db.doc("reports/"+uid);const sn=await ref.get();const items=sn.exists&&Array.isArray(sn.data().items)?[...sn.data().items]:[];
    items.push({adId:id,title:a?a.title:"",ownerId:a?a.ownerId:"",country:a?a.country:"",reason:$("#rreason").value,note:$("#rnote").value.trim().slice(0,500),createdAt:Date.now()});
    await ref.set({items:items.slice(-30)});closeModal();toast(T("Thanks — your report was sent to the admin"))}
  catch(e){toast(T("Couldn't send, please try again"))}
}
async function dismissReport(reporter,at){try{const ref=db.doc("reports/"+reporter);const sn=await ref.get();if(sn.exists){await ref.set({items:(sn.data().items||[]).filter(r=>r.createdAt!==at)})}toast("Report dismissed")}catch(e){toast("Couldn't update")}}
async function removeReported(reporter,at,adId){try{await db.doc("ads/"+adId).delete()}catch(e){}await dismissReport(reporter,at);toast("Ad removed")}
async function blockSeller(ownerId){if(!ownerId||ownerId==="demo")return;try{await db.doc("blocked/"+ownerId).set({at:Date.now()});toast("Seller blocked — they can no longer post")}catch(e){toast("Couldn't block")}}
async function unblock(id){try{await db.doc("blocked/"+id).delete();toast("Seller unblocked")}catch(e){toast("Couldn't update")}}
function openLegal(which){
  const terms=`<h4>1. About Naa Souq</h4>Naa Souq is a free classified-ads website where people post items and services for sale in their own country. Naa Souq is not a party to any sale and does not handle payments between buyers and sellers.
<h4>2. Your ads</h4>You are responsible for your ads. They must be truthful, in the right category, and legal in your country. Each ad stays live for ${AD_DAYS} days.
<h4>3. Not allowed</h4>Weapons, drugs, alcohol, medicines, counterfeit or stolen goods, adult content, and anything illegal in your country. Scams, spam and duplicate ads are not allowed.
<h4>4. Removal</h4>We may remove any ad or block any account that breaks these rules, without notice.
<h4>5. Safety</h4>Meet in public places, check items before paying, and never send money in advance. Naa Souq is not responsible for deals made between users.
<h4>6. Changes</h4>These terms may change. Using the site means you accept the current terms.`;
  const privacy=`<h4>What we collect</h4>The ads you post (text, photos, price, city), the contact phone number you add to an ad, and your account ID.
<h4>How it is used</h4>To show your ads to buyers in your country and to let them contact you. Your phone number is shown on your ads so buyers can call or WhatsApp you.
<h4>What we don't do</h4>We do not sell your data. Saved ads are visible only to you.
<h4>Your choices</h4>You can edit or delete your ads at any time. Ask the site owner to delete your account data.
<h4>Device storage</h4>The site remembers your country and language on your device.`;
  openModal(`<div class="hd"><h3>${which==="terms"?T("Terms of use"):T("Privacy policy")}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="legal" dir="ltr" style="text-align:left">${which==="terms"?terms:privacy}</div>`);
}
function showPh(el,i){$("#gal").style.backgroundImage=`url('${window._gal[i]}')`;document.querySelectorAll(".gthumbs div").forEach(d=>d.classList.remove("on"));el.classList.add("on")}

/* ---------- Country picker ---------- */
function openCountry(){
  openModal(`<div class="hd"><h3>${T("Choose your country")}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <input type="text" id="csearch" placeholder="${T("Search country…")}" oninput="drawCountries()" autocomplete="off"><div class="clist" id="clist"></div>`);
  drawCountries();
}
function drawCountries(){
  const s=($("#csearch").value||"").toLowerCase();
  $("#clist").innerHTML=COUNTRIES.map(c=>({c:c.c,n:cName(c.c),en:c.n})).filter(c=>c.n.toLowerCase().includes(s)||c.en.toLowerCase().includes(s)).sort((a,b)=>a.n.localeCompare(b.n,lang)).map(c=>`<div class="${c.c===country?"on":""}" onclick="setCountry('${c.c}')"><span style="font-size:20px">${flag(c.c)}</span>${esc(c.n)}</div>`).join("");
}
function setCountry(c){country=c;save("nx_country",c);closeModal();cat="All";subscribeAds();render()}

function openModal(h){$("#sheet").innerHTML=h;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}

/* ---------- Data ---------- */
function startTimer(){clearTimeout(loadTimer);loadTimer=setTimeout(()=>{if(status==="loading"){status="slow";if(view==="home")render()}},10000)}
function subscribeAds(){
  if(!db)return;
  if(unsubAds)unsubAds();
  ads=[];status="loading";startTimer();
  unsubAds=db.collection("ads").where("country","==",country).where("status","==","approved").onSnapshot(s=>{
    ads=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){status="ready";clearTimeout(loadTimer)}else if(status==="loading")status="ready";
    if(view==="home"||view==="admin")render();
    if(pendingAd)tryPendingAd();
  },e=>{status="slow";clearTimeout(loadTimer);if(view==="home")render()});
}
function softRender(){if(view==="home"||view==="my"||view==="admin")render();else if(view==="plans")render();else if(view==="post"){const p=$(".panel .quota");if(p)p.parentElement.innerHTML="<h2>Your posting balance</h2>"+quotaHTML()}}

try{if("serviceWorker" in navigator&&window.top===window.self&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
(async()=>{
  render();
  if(autoDetected)setTimeout(()=>toast(`${flag(country)} `+T("Showing {0} · prices in {1} — tap the country to change",cName(country),curFor(country))),600);
  if(!(window.claude&&claude.use)){status="nodb";render();return}
  startTimer();
  [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db){status="nodb";render();return}
  if(user){
    try{uid=await user.id()}catch(e){}
    try{isOwner=!!(await user.isOwner())}catch(e){}
    try{const w=await user.can("data.write");if(w===false)canWrite=false}catch(e){}
  }
  subscribeAds();
  db.collection("blocked").onSnapshot(sn=>{blocked=new Set(sn.docs.map(d=>d.id));if(view==="home"||view==="admin"||view==="post")render()},()=>{});
  db.collection("catphotos").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.cat&&x.photo)m[x.cat]=x.photo});catPhotos=m;if(view==="home"||view==="admin")render()},()=>{});
  if(uid){
    db.collection("ads").where("ownerId","==",uid).onSnapshot(s=>{myAds=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="my")render()},()=>{});
    db.doc("data/users/"+uid+"/prefs").onSnapshot(sn=>{const d=sn.exists?sn.data():{};favs=new Set(Array.isArray(d.favs)?d.favs:[]);if(view==="home")render()},()=>{});
    if(isOwner)db.collection("ads").where("status","==","pending").onSnapshot(sn=>{pendingAds=sn.docs.map(d=>({id:d.id,...d.data()}));renderNav();if(view==="admin")render()},()=>{});
    if(isOwner)db.collection("reports").onSnapshot(sn=>{reports=sn.docs.flatMap(d=>((d.data()||{}).items||[]).map(r=>({...r,reporter:d.id})));if(view==="admin")render()},()=>{});
    db.doc("accounts/"+uid).onSnapshot(s=>{acc=s.exists?{...s.data()}:{};softRender()},()=>{});
    const pq=isOwner?db.collection("payments"):db.collection("payments").where("uid","==",uid);
    pq.onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));if(isOwner)pays=all;myPays=all.filter(p=>p.uid===uid);if(view==="plans"||view==="admin")render()},()=>{});
  }
  render();
})();
</script>
</body>
